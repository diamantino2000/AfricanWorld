<!DOCTYPE html>
<html lang="es" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-es="Ajustes de Cuenta - AfricanWorld" data-fr="Paramètres du Compte - AfricanWorld" data-en="Account Settings - AfricanWorld" data-pt="Configurações da Conta - AfricanWorld">Ajustes de Cuenta - AfricanWorld</title>
    
    <!-- FAVICON -->
    <link rel="icon" type="image/png" sizes="32x32" href="/static/uploads/logo.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/uploads/logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/uploads/logo.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-african-green { background-color: #007A3D; }
        .text-african-green { color: #007A3D; }
        .bg-african-yellow { background-color: #FCD116; }
        .bg-african-red { background-color: #CE1126; }
        .text-african-red { color: #CE1126; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-african-green text-white shadow-md border-b-4 border-african-yellow">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/" class="flex items-center space-x-3">
                <img src="/static/uploads/logo.png" alt="Logo" class="h-14 w-auto object-contain">
                <span class="text-2xl font-black text-white">African<span class="text-african-yellow">World</span></span>
            </a>
            <a href="/perfil/{{ user.username }}" class="bg-white text-gray-900 px-4 py-2 rounded-xl text-xs font-bold" data-es="Volver al Perfil" data-fr="Retour au Profil" data-en="Back to Profile" data-pt="Voltar ao Perfil">Volver al Perfil</a>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-10 flex-grow w-full space-y-6">
        <div class="bg-white p-8 rounded-3xl border shadow-sm space-y-6">
            <h1 class="text-2xl font-black text-gray-900 flex items-center gap-2">
                <i class="fa-solid fa-gear text-african-green"></i> 
                <span data-es="Configuración de la Cuenta" data-fr="Paramètres du Compte" data-en="Account Settings" data-pt="Configurações da Conta">Configuración de la Cuenta</span>
            </h1>

            <form action="/settings" method="POST" enctype="multipart/form-data" class="space-y-6">
                
                <!-- IDIOMA DE LA PLATAFORMA -->
                <div class="bg-gray-50 p-4 rounded-2xl border space-y-2">
                    <label class="block text-xs font-bold text-gray-700" data-es="Idioma de la Plataforma" data-fr="Langue de la Plateforme" data-en="Platform Language" data-pt="Idioma da Plataforma">Idioma de la Plataforma</label>
                    <select name="language" id="settings-lang-select" onchange="applyPlatformLanguage(this.value)" class="w-full border px-4 py-2.5 rounded-xl text-sm font-bold bg-white focus:ring-2 focus:ring-african-green focus:outline-none">
                        <option value="es">🇪🇸 Español</option>
                        <option value="fr">🇫🇷 Français</option>
                        <option value="en">🇬🇧 English</option>
                        <option value="pt">🇵🇹 Português</option>
                    </select>
                </div>

                <!-- FOTO DE PERFIL PERSISTENTE -->
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-gray-700" data-es="Foto de Perfil" data-fr="Photo de Profil" data-en="Profile Picture" data-pt="Foto de Perfil">Foto de Perfil</label>
                    <div class="flex items-center gap-4">
                        <img id="avatar-preview" src="{{ user.profile_pic if user.profile_pic else '/static/uploads/default_user.png' }}" class="w-20 h-20 rounded-full object-cover border-4 border-african-yellow shadow">
                        <label class="bg-emerald-50 text-african-green border px-4 py-2 rounded-xl text-xs font-bold cursor-pointer">
                            <span data-es="Elegir Foto" data-fr="Choisir une Photo" data-en="Choose Photo" data-pt="Escolher Foto">Elegir Foto</span>
                            <input type="file" name="profile_pic" accept="image/*" class="hidden" onchange="previewAndCompressProfilePic(event)">
                        </label>
                    </div>
                </div>

                <!-- USUARIO Y CONTACTO GUARDADO -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1" data-es="Nombre de Usuario" data-fr="Nom d'utilisateur" data-en="Username" data-pt="Nome de Usuário">Nombre de Usuario</label>
                    <input type="text" name="username" value="{{ user.username }}" required class="w-full border px-4 py-2.5 rounded-xl text-sm font-bold bg-gray-50">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1" data-es="País" data-fr="Pays" data-en="Country" data-pt="País">País</label>
                        <input type="text" name="country" value="{{ user.country if user.country else '' }}" required class="w-full border px-4 py-2.5 rounded-xl text-sm font-bold bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1" data-es="Ciudad" data-fr="Ville" data-en="City" data-pt="Cidade">Ciudad</label>
                        <input type="text" name="city" value="{{ user.city if user.city else '' }}" required class="w-full border px-4 py-2.5 rounded-xl text-sm font-bold bg-gray-50">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1" data-es="Número de Teléfono" data-fr="Numéro de téléphone" data-en="Phone number" data-pt="Número de telefone">Número de Teléfono</label>
                    <input type="text" name="phone" value="{{ user.phone if user.phone else '' }}" required class="w-full border px-4 py-2.5 rounded-xl text-sm font-bold bg-gray-50">
                </div>

                <button type="submit" class="w-full bg-african-green text-white py-3 rounded-xl font-bold text-sm shadow hover:opacity-90" data-es="Guardar Cambios" data-fr="Enregistrer les Modifications" data-en="Save Changes" data-pt="Salvar Alterações">
                    Guardar Cambios
                </button>
            </form>

            <!-- ZONA DE ACCIONES DE SESIÓN Y CUENTA -->
            <div class="border-t pt-6 space-y-4">
                <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                    <a href="/logout" class="w-full sm:w-auto text-center bg-gray-100 text-gray-700 px-5 py-2.5 rounded-xl text-xs font-bold border hover:bg-gray-200 transition">
                        <i class="fa-solid fa-right-from-bracket mr-1"></i> 
                        <span data-es="Cerrar Sesión" data-fr="Déconnexion" data-en="Log Out" data-pt="Sair">Cerrar Sesión</span>
                    </a>

                    <form action="/account/delete" method="POST" onsubmit="return confirm('¿Estás seguro de que deseas eliminar tu cuenta permanentemente? Esta acción no se puede deshacer.')" class="w-full sm:w-auto">
                        <button type="submit" class="w-full text-center bg-red-50 text-african-red px-5 py-2.5 rounded-xl text-xs font-bold border border-red-200 hover:bg-red-100 transition">
                            <i class="fa-solid fa-trash mr-1"></i> 
                            <span data-es="Eliminar Cuenta" data-fr="Supprimer le Compte" data-en="Delete Account" data-pt="Excluir Conta">Eliminar Cuenta</span>
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const userLang = "{{ user.language if user and user.language else '' }}";
            const savedLang = userLang || localStorage.getItem("user_selected_language") || "es";
            
            const selectEl = document.getElementById("settings-lang-select");
            if (selectEl) selectEl.value = savedLang;
            
            applyPlatformLanguage(savedLang);
        });

        function applyPlatformLanguage(langCode) {
            localStorage.setItem("user_selected_language", langCode);
            const htmlRoot = document.getElementById("html-root");
            htmlRoot.setAttribute("lang", langCode);
            htmlRoot.removeAttribute("dir"); // Sin soporte rtl ya que se retiró el árabe

            document.querySelectorAll("[data-es]").forEach(function(el) {
                const translation = el.getAttribute("data-" + langCode);
                if (translation) {
                    el.textContent = translation;
                } else {
                    el.textContent = el.getAttribute("data-es");
                }
            });
        }

        function previewAndCompressProfilePic(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = 300;
                    canvas.height = 300;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 300, 300);
                    document.getElementById('avatar-preview').src = canvas.toDataURL('image/jpeg', 0.75);
                }
            }
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
